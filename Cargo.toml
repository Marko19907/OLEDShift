[package]
name = "OLEDShift"
version = "1.1.4"
edition = "2021"
build = "build.rs"

[profile.release]
lto = true
codegen-units = 1

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package.metadata.winresource]
OriginalFilename = "OLEDShift.exe"
FileDescription = "OLEDShift"
ProductName = "OLEDShift"
ProductVersion = "1.1.4"

[build-dependencies]
winresource = "0.1.28"

[dependencies]
cfg-if = "1.0.4"
lazy_static = "1.5.0"
libloading = "0.9"
native-windows-gui = { version = "1.0.13", features = ["notice", "high-dpi", "number-select"] }
rand = "0.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.147"
open = "5.3.3"
windows = { version = "0.62.2", features = ["ApplicationModel", "ApplicationModel_Activation", "Foundation", "Storage", "Storage_Search", "System", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Packaging_Appx", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-future = "0.3.2"
